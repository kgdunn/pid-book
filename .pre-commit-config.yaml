# Pre-commit hooks for the pid-book repository.
#
# Install the git hook once with `make pre-commit-install`; run every hook
# against the whole tree with `make pre-commit-run`. See CONTRIBUTING.md.
#
# Ruff settings live in [tool.ruff] and rstcheck settings in [tool.rstcheck],
# both in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # .txt is excluded from the whitespace fixers so the book's data tables
      # are never churned.
      - id: trailing-whitespace
        exclude: '\.txt$'
      - id: end-of-file-fixer
        exclude: '\.txt$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Lint and format the repo's Python. Scoped to the build/tooling files;
  # the chapter gists and server scripts are deliberately left alone.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: '^(conf\.py|start_server\.py|my-extensions/.*\.py)$'
      - id: ruff-format
        files: '^(conf\.py|start_server\.py|my-extensions/.*\.py)$'

  # Sanity-check reStructuredText. rstcheck never rewrites the book.
  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.2.5
    hooks:
      - id: rstcheck
        additional_dependencies: [sphinx>=8.0]
