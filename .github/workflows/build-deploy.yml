name: Build and deploy book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Pushes/dispatch share one queue (so deploys never race); each PR gets its
  # own queue so multiple PRs can validate in parallel.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-learnche' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pid-book
        uses: actions/checkout@v4

      - name: Checkout figures repo
        uses: actions/checkout@v4
        with:
          repository: kgdunn/figures
          path: figures-src

      - name: Symlink figures into the source tree
        run: ln -s "$PWD/figures-src" figures

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Set up Node.js (for Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch ECharts (for sidebar sparklines)
        # Pinned official Apache ECharts build, line/bar/pie subset.
        # ~280 KB minified / ~80 KB gzip; served from same origin so no
        # third-party requests at runtime. The file is .gitignored.
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _static/js
          curl -fsSL --retry 3 \
            -o _static/js/echarts-min.js \
            https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.simple.min.js
          test -s _static/js/echarts-min.js

      # Build HTML runs before the TeX Live install: the apt-get step is slow
      # and is not a prerequisite for the HTML build, so a broken HTML build
      # surfaces as a fast early signal.
      - name: Build HTML
        env:
          PID_BOOK_TELEMETRY: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          PID_BOOK_GC_CODE: ${{ vars.GOATCOUNTER_CODE || 'learnche-pid' }}
        run: uv run make html

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-xetex \
            latexmk

      - name: Build PDF
        # Sidestep the xdg-open step at the end of the `latexpdf` target,
        # which has no display on a CI runner.
        run: |
          uv run make latex
          make -C _build/latex all-pdf

      - name: Verify build outputs
        # The master page is `_build/html/contents` (not index.html) because
        # conf.py sets `master_doc = "contents"` and `html_file_suffix = ""`.
        run: |
          test -s _build/html/contents
          test -s _build/latex/PID.pdf

      - name: Configure SSH for learnche.org
        if: github.event_name != 'pull_request'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LEARNCHE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LEARNCHE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H 139.162.148.246 >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to learnche.org [139.162.148.246] (staging)
        if: github.event_name != 'pull_request'
        env:
          SSH_USER: ${{ secrets.LEARNCHE_SSH_USER }}
        run: |
          rsync -avz --delete-after \
            _build/html/ \
            "$SSH_USER@139.162.148.246:/var/www/learnche.org/pid/"
          rsync -avz \
            _build/latex/PID.pdf \
            "$SSH_USER@139.162.148.246:/var/www/learnche.org/pid/"
