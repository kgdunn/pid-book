<div role="search" class="sidebar-search-container">
  <link rel="preload" href="{{ pathto('pagefind/pagefind.js', 1) }}" as="script" crossorigin>
  <link rel="stylesheet" href="{{ pathto('pagefind/pagefind-ui.css', 1) }}" />
  <script src="{{ pathto('pagefind/pagefind-ui.js', 1) }}"></script>
  <div id="pagefind-search"></div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      new PagefindUI({
        element: "#pagefind-search",
        showSubResults: true,
        showImages: false,
        resetStyles: false,
        placeholder: "Search the book  [Ctrl+K]"
      });
    });

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        const input = document.querySelector('.pagefind-ui__search-input');
        if (input) {
          input.focus();
          input.select();
        }
      }
    });
  </script>
</div>
