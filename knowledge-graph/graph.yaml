  aliases:
  - low level
  - high level
  book_label: DOE-two-level-factorials
  evidence: design-analysis-experiments/full-factorial-designs/index.rst:19
  quote: In this section we consider the case when these factors are at two levels.
- id: cause_and_effect
  name: Cause and effect
  type: Concept
  definition: A change in a factor that produces a change in the response; shown only by intentional manipulation.
  aliases:
  - causality
  book_label: DOE_learning_about_systems
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:26
  quote: you must disturb your system, and then observe it. This is the principle of causality, or
- id: happenstance_data
  name: Happenstance data
  type: Concept
  definition: Everyday operating data, collected without intentional changes to the system; it is confounded by
    other events, so it cannot be relied on to imply cause and effect.
  aliases:
  - operating data
  book_label: DOE_learning_about_systems
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:57
  quote: That is why happenstance data cannot be relied on to imply cause and effect.
- id: feedback_control
  name: Feedback control
  type: Concept
  definition: Control systems keep operation in a small zone, so the data they produce carry little information.
  aliases: []
  book_label: DOE_learning_about_systems
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:36
  quote: Feedback control systems keep the region of operation to a small zone.
- id: correlation
  name: Correlation
  type: Concept
  definition: Two variables moving together. Some association is usually present when there is a causal link, but
    on its own it is not sufficient evidence of causality.
  aliases: []
  book_label: DOE-yield-pressure-impurity-correlation
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:63
  quote: some observable association is usually present when there is a causal link, but the association on its
    own is not sufficient evidence of it.
- id: learning_cycle
  name: Learning cycle
  type: Concept
  definition: Conjecture, expected consequences, experiment and data, then a new or revised conjecture.
  aliases:
  - iterative learning
  book_label: DOE_learning_about_systems
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:12
  quote: 'learning from and improving a system is an iterative process. It usually follows this cycle:'
- id: conjecture
  name: Conjecture
  type: Concept
  definition: A hypothesis believed true, whose consequences an experiment tests.
  aliases:
  - hypothesis
  book_label: DOE_learning_about_systems
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:14
  quote: Make a conjecture (hypothesis), which we believe is true.
- id: troubleshooting
  name: Troubleshooting
  type: Concept
  definition: Experimenting to fix a problem, which also shows how the system works.
  aliases: []
  book_label: DOE_learning_about_systems
  evidence: design-analysis-experiments/why-learning-about-systems-is-important.rst:19
  quote: One of the most frequent reasons we experiment is to fix a problem with our process.
- id: disturbance
  name: Disturbance
  type: Concept
  definition: 'A variable that affects y but is not of interest: operators, ambient conditions, equipment, lab analyses,
    time.'
  aliases:
  - nuisance variable
  book_label: DOE_blocking_section
  evidence: design-analysis-experiments/blocking-and-confounding-for-disturbances.rst:14
  quote: Operators, ambient conditions, physical equipment, lab analyses, and time-dependent effects (catalyst deactivation,
    fouling), will impact the response.
- id: controlled_disturbance
  name: Controlled disturbance
  type: Concept
  definition: A disturbance held constant for all runs, so its effect cancels out.
  aliases: []
  book_label: DOE_blocking_section
  evidence: design-analysis-experiments/blocking-and-confounding-for-disturbances.rst:20
  quote: in which case it isn't a disturbance anymore, as it is held constant for all experiments, and its effect
    cancels out.
- id: time_effect
  name: Time-dependent effect
  type: Concept
  definition: Slow changes such as catalyst deactivation or fouling that affect the response over time.
  aliases:
  - drift
  book_label: DOE_blocking_section
  evidence: design-analysis-experiments/blocking-and-confounding-for-disturbances.rst:14
  quote: and time-dependent effects (catalyst deactivation, fouling), will impact the response.
- id: randomization
  name: Randomization
  type: Concept
  definition: Running experiments in random order so unknown disturbances cannot systematically affect the response.
  aliases:
  - random order
  book_label: DOE-randomization
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:180
  quote: experiments must be performed in random order to avoid any unmeasured, and uncontrolled, disturbances from
    impacting the system.
- id: randomization_test
  name: Randomization test
  type: Method
  definition: Compare the observed difference with the differences from every possible reassignment of the A and
    B labels.
  aliases:
  - permutation test
  book_label: DOE-randomization
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:194
  quote: Fisher's insight was to create one long vector of these outcomes
- id: pairing
  name: Pairing
  type: Method
  definition: Running two experiments on the same subject and analysing their difference, so a shared disturbance
    cancels.
  aliases: []
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/blocking-and-confounding-for-disturbances.rst:16
  quote: pairing is when two experiments are run on the same subject and we analyze the differences in the two response
    values, rather than the actual response values.
- id: two_group_comparison
  name: Comparing two conditions
  type: Method
  definition: Comparing condition A with B using a pooled variance and a confidence interval for the difference.
  aliases:
  - A versus B test
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:19
  quote: We first calculate a pooled variance, then a
- id: pooled_variance
  name: Pooled variance
  type: Concept
  definition: A combined variance estimate from two groups, used in the z-value for their difference.
  aliases: []
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:40
  quote: which already assumes the spread at level A equals the spread at level B.
- id: indicator_variable
  name: Indicator variable
  type: Concept
  definition: A 0/1 variable that codes condition A or B in a least squares model.
  aliases:
  - dummy variable
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:141
  quote: is an indicator variable. For example,
- id: confidence_interval
  name: Confidence interval
  type: Concept
  definition: A range for an effect; the effect is statistically significant when the interval does not span zero.
  aliases: []
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:33
  quote: significant effect when this confidence interval does not span zero.
- id: t_distribution
  name: t-distribution
  type: Concept
  definition: The reference distribution for a difference or a coefficient divided by its standard error.
  aliases: []
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:31
  quote: from the data (rather than known), this statistic is strictly
- id: null_hypothesis
  name: Null hypothesis
  type: Concept
  definition: "The statement a test takes as true until the data give evidence against it; for A versus B, that
    there is no difference between them."
  aliases: []
  book_label: DOE-randomization
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:196
  quote: "We do this because the null hypothesis, the statement a test takes as true until the data give evidence
    against it, is that there is no difference between A and B."
- id: statistical_significance
  name: Statistical significance
  type: Concept
  definition: An effect is statistically significant when its confidence interval does not span zero; without replicates,
    Lenth's margin of error gives an objective cutoff instead.
  aliases: []
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/full-factorial-designs/assessing-significance-of-main-effects-and-interactions.rst:12
  quote: There are three ways to judge whether a main effect or interaction is significant.
- id: practical_significance
  name: Practical significance
  type: Concept
  definition: Whether an effect is large enough to matter, judged from the interval's width and the process variance.
  aliases: []
  book_label: DOE_expts_with_single_variable
  evidence: design-analysis-experiments/experiments-with-a-single-variable-at-two-levels.rst:33
  quote: However, the width of this interval and how symmetrically it spans zero can cause us to come to a different,
- id: cost
  name: Changing one single variable at a time
  type: Method
  definition: "Changing one factor at a time, in a search or a fixed design: interactions go unestimated, effects
    are less precise than a factorial's, and a search can stop at a suboptimal point."
  aliases:
  - COST
  - OFAT
  - one factor at a time
  book_label: DOE-COST-approach
  evidence: design-analysis-experiments/changing-one-single-variable-at-a-time.rst:25
  quote: "is not an efficient way for experimentation. Note that OFAT is an alternative name for COST"
- id: false_optimum
  name: False optimum
  type: Concept
  definition: A point that looks best when factors are changed one at a time, but is not the optimum.
  aliases:
  - suboptimal solution
  book_label: DOE-COST-approach
  evidence: design-analysis-experiments/changing-one-single-variable-at-a-time.rst:46
  quote: Changing one single variable at a time leads you into thinking you've reached the optimum, when all you've
    done in fact is trap yourself at a suboptimal solution.
- id: order_dependence
  name: Order dependence
  type: Concept
  definition: With COST the result depends on which factor is changed first.
  aliases: []
  book_label: DOE-COST-approach
  evidence: design-analysis-experiments/changing-one-single-variable-at-a-time.rst:48
  quote: 'This is very unsatisfactory: we cannot use methods to optimize our processes that depend on the order
    of experiments!'
- id: designed_experiment
  name: Designed experiment
  type: Concept
  definition: "A planned set of runs; with several factors it changes them simultaneously, often needing fewer runs
    than COST, and gives the same result whatever the run order."
  aliases:
  - experimental arrangement
  - DOE
  - design of experiments
  - experimental design
  book_label: DOE-COST-approach
  evidence: design-analysis-experiments/changing-one-single-variable-at-a-time.rst:52
  quote: "Designed experiments are always run in random order -- as we will presently see -- and we will get the
    same result, no matter the order."
- id: full_factorial
  name: Full factorial
  type: DesignType
  definition: "Every combination of the factors' levels; factors may have different numbers of levels (3 x 2 x 2 = 12 runs). At two levels each, 2^k runs for k factors."
  aliases:
  - complete factorial
  - 2^k factorial
  - two-level factorial
  found_as:
  - factorial design
  book_label: DOE-two-level-factorials
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:25
  quote: "the :math:`2` refers to the number of levels for each factor"
- id: coding
  name: Coding
  type: Concept
  definition: "Centering and scaling a factor; the standard form is (value - center)/(range/2), so low is -1 and
    high is +1."
  aliases:
  - coded units
  - centering and scaling
  found_as:
  - coded variable
  book_label: DOE-analysis-by-least-squares
  evidence: design-analysis-experiments/full-factorial-designs/analysis-by-least-squares-modelling.rst:28
  quote: "It is standard practice to represent the data from designed experiments in a centered and scaled form:"
- id: standard_order
  name: Standard order
  type: Concept
  definition: Writing runs with the first factor's sign alternating fastest and the last slowest.
  aliases:
  - Yates order
  found_as:
  - Yates's order
  book_label: DOE-two-level-factorials
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:25
  quote: which alternates the sign of the first variable the fastest and the last variable the slowest.
- id: operating_range
  name: Choosing the factor range
  type: Guideline
  definition: Choose low and high at the edges of normal operation, not at the extreme values a factor could take.
  aliases: []
  book_label: file:design-analysis-experiments/full-factorial-designs/index.rst
  evidence: design-analysis-experiments/full-factorial-designs/index.rst:19
  quote: The general guidance is to choose the low and high values at the edges of normal operation.
- id: cube_plot
  name: Cube plot
  type: Plot
  definition: The design drawn as a square or cube with the response written at each corner.
  aliases: []
  book_label: DOE-two-level-factorials
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:62
  quote: For simple systems you can visualize the design and results
- id: main_effect
  name: Main effect
  type: Concept
  definition: The average change in y when a factor moves from its low to its high level.
  aliases: []
  book_label: DOE-two-level-factorials-main-effects
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:79
  quote: The effects are considered, by convention, to be the difference from the high level to the low level.
- id: interaction
  name: Interaction
  type: Concept
  definition: When the effect of one factor depends on the level of another. Interactions are symmetric.
  aliases:
  - factor dependence
  - interaction effect
  book_label: DOE-two-level-factorials-interaction-effects
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:134
  quote: In summary, interaction means the effect of one factor depends on the level of the other factor.
- id: two_factor_interaction
  name: Two-factor interaction
  type: Concept
  definition: The interaction of two factors, such as T x S.
  aliases:
  - 2fi
  book_label: DOE-two-level-factorials-interaction-effects
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:186
  quote: What is missing is an interaction term, given by the product of temperature and substrate.
- id: three_factor_interaction
  name: Three-factor interaction
  type: Concept
  definition: The interaction of three factors; seldom large in real systems.
  aliases:
  - 3fi
  book_label: file:design-analysis-experiments/full-factorial-designs/example-design-and-analysis-of-a-three-factor-experiment.rst
  evidence: design-analysis-experiments/fractional-factorial-designs/index.rst:19
  quote: Very very seldom do three-factor interactions occur, nor are they often of practical significance.
- id: interaction_plot
  name: Interaction plot
  type: Plot
  definition: The response against one factor, a line per level of another; lines that are not parallel show interaction.
  aliases: []
  found_as:
  - interaction graph
  book_label: DOE-two-level-factorials-interaction-effects
  evidence: design-analysis-experiments/full-factorial-designs/using-two-levels-for-two-or-more-factors.rst:186
  quote: The lack of parallel lines is a clear indication of interaction.
- id: least_squares_model
  name: Least squares model
  type: Method
  level: 1  # taught with the two-level factorials; the cited line is a later restatement
  definition: y = Xb + e, fitted with b = (X'X)^-1 X'y. It works even when the design was not run exactly as planned.
  aliases:
  - least squares
  - linear model
  - regression
  book_label: DOE-analysis-by-least-squares
  evidence: design-analysis-experiments/extended-topics-related-to-designed-experiments.rst:28
  quote: 'whether the experimental design was executed accurately or not: the least squares model always works'
- id: model_matrix
  name: Model matrix X
  type: Concept
  level: 1  # the X matrix of the two-level analysis; the cited line is a later restatement
  definition: One row per run and one column per model term, with a column of ones for the intercept.
  aliases:
  - table of signs
  - X matrix
  found_as:
  - table of plus and minus signs
  book_label: DOE-analysis-by-least-squares
  evidence: design-analysis-experiments/optimal-designs.rst:147
  quote: Each row is one experimental run; each column is one term in the model.
- id: orthogonality
  name: Orthogonality
  type: Property
  definition: "The columns of X are mutually orthogonal, so X'X is diagonal and each coefficient is estimated and
    interpreted separately. Quadratic columns, which correlate with the intercept, are checked for
    orthogonality after centring."
  aliases:
  - orthogonal design
  book_label: DOE_orthogonality
  evidence: design-analysis-experiments/full-factorial-designs/analysis-by-least-squares-modelling.rst:92
  quote: "matrix has only zeros on the off-diagonals: it indicates that matrix"
- id: intercept
  name: Intercept
  type: Concept
  definition: The model's constant b0; for a coded factorial, the average of the runs and the predicted center point.
  aliases:
  - constant term
  - b0
  book_label: DOE-analysis-by-least-squares
  evidence: design-analysis-experiments/full-factorial-designs/analysis-by-least-squares-modelling.rst:104
  quote: Notice from the least squares equations how it is just the average of the four experimental values, even
    though we did not actually perform an experiment at the center.
- id: coefficient
  name: Coefficient
  type: Concept
  definition: "A parameter of the fitted model, one per term; for a coded factor's main effect it is the change in y
    per coded unit, over half the factor's range."
  aliases:
  - parameter
  - slope
  - Effect over half the range
  book_label: DOE-analysis-by-least-squares
  evidence: design-analysis-experiments/full-factorial-designs/analysis-by-least-squares-modelling.rst:98
  quote: "They are the same, as long as we are careful to interpret them as the change over"
- id: hierarchy_rule
  name: Keep the parent main effects
  type: Guideline
  definition: If an interaction is significant, keep in the model every main effect that it is made of.
  aliases:
  - model hierarchy
  book_label: file:design-analysis-experiments/full-factorial-designs/summary-so-far.rst
  evidence: design-analysis-experiments/full-factorial-designs/summary-so-far.rst:16
  quote: Also, if you conclude the interaction term is significant, then you must also include all main factors
    that make up that interaction term in the model.
- id: interpret_with_interaction
  name: Read main effects with their interactions
  type: Guideline
  definition: A main effect cannot be interpreted on its own when it takes part in a significant interaction.
  aliases: []
  book_label: file:design-analysis-experiments/full-factorial-designs/summary-so-far.rst
  evidence: design-analysis-experiments/full-factorial-designs/summary-so-far.rst:16
  quote: We cannot interpret the main effects separately from the interaction effects
- id: robustness
  name: Robustness
  type: Concept
  definition: 'A small effect means y is insensitive to that factor: y is robust to changes in it.'
  aliases: []
  book_label: file:design-analysis-experiments/full-factorial-designs/summary-so-far.rst
  evidence: design-analysis-experiments/full-factorial-designs/summary-so-far.rst:22
  quote: This is desirable in some situations. It means we can adjust that
- id: degrees_of_freedom
  name: Degrees of freedom
  type: Concept
  definition: "Independent values in a sum of squares. With n runs, p parameters and m distinct factor combinations (i-th run n_i times): residual n-p = pure error sum(n_i-1) + lack of fit m-p."
  aliases: []
  book_label: DOE-replicate_points
  evidence: design-analysis-experiments/full-factorial-designs/assessing-significance-of-main-effects-and-interactions.rst:193
  quote: "If there are more experiments than parameters to be estimated, then we have extra degrees of freedom."
- id: replicate
  name: Replicate
  type: Concept
  definition: 'One run repeated in full: setup, running the experiment and measuring the result. A design run twice
    has every run replicated; other texts call one such pass a replicate.'
  aliases:
  - repeat run
  - genuine replicate
  - replication
  book_label: DOE-replicate_points
  evidence: design-analysis-experiments/full-factorial-designs/assessing-significance-of-main-effects-and-interactions.rst:8
  quote: 'A replicate is one run repeated in full: system setup, running the experiment and measuring the result'
- id: repeat_measurement
  name: Repeat measurement
  type: Concept
  definition: Measuring one sample twice; it estimates only measurement error and is not a true replicate.
  aliases: []
  book_label: DOE-replicate_points
  evidence: design-analysis-experiments/full-factorial-designs/assessing-significance-of-main-effects-and-interactions.rst:8
  quote: is not a true replicate. That is only an estimate of the measurement error and analytical error.
- id: center_point
  name: Center point
  type: Concept
  definition: A run with every factor at coded 0. It checks overall curvature and, replicated, estimates pure error,
    but cannot tell which factor curves; in a factorial it keeps X orthogonal.
  aliases:
  - centre point
  - baseline run
  - center run
  book_label: DOE-replicate_points
  evidence: design-analysis-experiments/full-factorial-designs/assessing-significance-of-main-effects-and-interactions.rst:238
  quote: Note that the center point runs do not change the orthogonality of
- id: standard_error
  name: Standard error
  type: Concept
  definition: "The spread of an estimate such as a coefficient: its estimated standard deviation. In a coded
    orthogonal design, S_E(b) = sqrt(S_E^2 / sum x^2), with S_E the estimated noise standard deviation."
  aliases: []
  book_label: DOE-replicate_points
  evidence: design-analysis-experiments/full-factorial-designs/assessing-significance-of-main-effects-and-interactions.rst:195
  quote: "the standard error for coefficient :math:`b_i` is :math:`S_E(b_i) = \\sqrt{\\mathcal{V}\\left(b_i\\right)}
    = \\sqrt{\\dfrac{S_E^2}{\\sum{x_i^2}}}`"
- id: noise_standard_deviation
  name: Noise standard deviation
  type: Concept
  definition: "The run-to-run scatter of the response with every factor held fixed, sigma; its estimate S_E comes
    from replicate runs, residual degrees of freedom or external data."
