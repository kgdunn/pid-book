  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:327
  quote: Categorical factors usually take on a limited number of values.
- id: level
  name: Level
  type: Concept
