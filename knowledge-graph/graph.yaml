nodes:
- id: experiment
  name: Experiment
  type: Concept
  definition: Intentionally disturbing a system by changing factors, to learn cause and effect.
  aliases: []
  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:274
  quote: In order to learn about a system, we have to disturb it and change it. This is to ensure cause and effect.
- id: run
  name: Run
  type: Concept
  definition: 'One experiment in a set: eight experiments are eight runs.'
  aliases:
