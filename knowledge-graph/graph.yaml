  found_as:
  - treatment combination
  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:338
  quote: When we perform an experiment, we call it a run.
- id: response
  name: Response
  type: Concept
  definition: The measured outcome of a run, written y. It must always be measurable in some way.
  aliases:
  - outcome
  - response variable
  - y
  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:300
  quote: An important aspect about the outcome is that it is always measurable--in some way.
- id: qualitative_outcome
  name: Qualitative outcome
  type: Concept
  definition: An outcome described in categories, such as pass or fail, or a colour.
  aliases: []
  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:302
  quote: A qualitative outcome might also be a description of what happened, for example,
- id: objective
  name: Objective
  type: Concept
  definition: 'An outcome together with what you want of it: maximize, minimize, or keep the same.'
  aliases: []
  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:307
  quote: which combines an outcome and the need to adjust that outcome.
- id: factor
  name: Factor
  type: Concept
  definition: The thing you can change to influence the outcome.
  aliases:
  - variable
  book_label: file:design-analysis-experiments/design-analysis-experiments.rst
  evidence: design-analysis-experiments/design-analysis-experiments.rst:298
  quote: is the thing you can change to influence the outcome.
- id: numeric_factor
  name: Numeric factor
  type: Concept
